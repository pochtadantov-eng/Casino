name: CI

on:
  push:
    branches: ['claude/**']
    paths: ['src/**', 'test/**', 'scripts/market-smoke.ts', 'package*.json', 'tsconfig.json', '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json 2>&1 | tee _tsc.txt; exit ${PIPESTATUS[0]}
        continue-on-error: true
        id: tsc
      - name: Tests
        run: npx vitest run 2>&1 | tee _vitest.txt; exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: Live market smoke test
        run: mkdir -p _out && npx tsx scripts/market-smoke.ts _out/market.json 2>&1 | tee _out/smoke.log
        continue-on-error: true
      - name: Publish report to ci-report
        run: |
          mkdir -p _out && cp _tsc.txt _vitest.txt _out/ 2>/dev/null || true
          cd _out
          git init -q -b ci-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "ci ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-report
