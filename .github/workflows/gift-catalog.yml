name: Gift catalog

# Samples Fragment gifts (random model/backdrop/symbol) with full internet and publishes catalog.json to the gift-catalog branch.
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/gift-catalog.mjs', '.github/workflows/gift-catalog.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env:
          COLLS: lolpop,deskcalendar,genielamp,libertyfigure,chillflame,eternalcandle,hangingstar
        timeout-minutes: 12
        run: mkdir -p _gc && cd _gc && npm init -y >/dev/null && mkdir -p out && (npm i sharp 2>&1 | tail -3 > out/npm.log; cp ../scripts/gift-catalog.mjs . && node gift-catalog.mjs out 2>&1 | tee out/log.txt)
      - name: Publish to gift-catalog
        if: always()
        run: |
          cd _gc/out
          git init -q -b gift-catalog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "gift catalog ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gift-catalog
