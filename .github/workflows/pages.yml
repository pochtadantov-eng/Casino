name: Deploy Mini App preview

# Every push to these branches republishes webapp/ (demo mode) to the gh-pages branch.
on:
  push:
    branches: [main, master, 'claude/**']
    paths: ['webapp/**', 'scripts/build-pages.mjs', 'scripts/market-snapshot.ts', 'src/market/**', '.github/workflows/pages.yml']
  schedule:
    - cron: '7 */6 * * *'      # refresh rates and showcase gifts every 6 hours (frequent deploys clog GitHub Pages)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build-pages.mjs _site
      - run: npm ci
      - name: Live market data (rates, showcase gifts)
        run: npx tsx scripts/market-snapshot.ts _site
        continue-on-error: true
      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
